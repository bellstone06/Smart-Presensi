<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; } 
        #reader { border: none !important; }
        #reader__dashboard_section_csr span { color: white !important; }
        #reader__dashboard_section_swaplink { color: #60a5fa !important; text-decoration: none; margin-top: 10px; display: inline-block; }
        #reader button { background-color: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; margin: 5px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-slate-200">

    <input type="text" id="rfidFocusInput" autocomplete="off" style="position: absolute; opacity: 0; pointer-events: none;">

    <div class="text-center mb-6 mt-4">
        <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">Portal Absensi</h1>
        <p class="text-slate-400 text-lg">Arahkan QR Code Kartu Pelajar Anda ke Scanner</p>
        <div id="clockWidget" class="text-3xl font-bold text-indigo-400 mt-4 bg-slate-800/50 inline-block px-6 py-2 rounded-full border border-slate-700/50 shadow-inner">--:--:--</div>
    </div>

    <div class="bg-slate-800 p-4 rounded-3xl shadow-2xl shadow-indigo-500/10 w-full max-w-md border border-slate-700 relative overflow-hidden">
        <div class="bg-black rounded-2xl overflow-hidden relative border-4 border-slate-700">
            <div id="reader" class="w-full"></div>
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-10">
                <div class="w-48 h-48 border-2 border-indigo-500/50 rounded-2xl relative">
                    <div class="absolute -top-1 -left-1 w-6 h-6 border-t-4 border-l-4 border-indigo-400 rounded-tl-xl"></div>
                    <div class="absolute -top-1 -right-1 w-6 h-6 border-t-4 border-r-4 border-indigo-400 rounded-tr-xl"></div>
                    <div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-4 border-l-4 border-indigo-400 rounded-bl-xl"></div>
                    <div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-4 border-r-4 border-indigo-400 rounded-br-xl"></div>
                </div>
            </div>
        </div>

        <div id="statusBox" class="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center z-20 transition-opacity duration-300 opacity-0 pointer-events-none">
            <i id="statusIcon" class="fa-solid fa-spinner fa-spin text-6xl mb-4 text-indigo-500"></i>
            <h2 id="statusTitle" class="text-2xl font-bold text-white mb-1">Memproses...</h2>
            <p id="statusDesc" class="text-slate-300 text-center px-6">Mohon tunggu sebentar</p>
        </div>
    </div>
    
    <div class="mt-8 text-slate-500 text-sm flex items-center gap-2">
        <i class="fa-solid fa-shield-halved text-emerald-400"></i> Anti-Duplikat & Auto-Focus Aktif
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKVk3apqIkVMzvD4bTqZ7OCRLCLuPt4dg3h5Nfyx6v9DUMnECNTgB-i3ClIcsfKCw_mQ/exec';

        setInterval(() => { document.getElementById('clockWidget').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000);

        function playBeep(isError = false) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.value = isError ? 300 : 850; 
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); 
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        function ucapkanSuara(namaSiswa, pesan) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let teksLengkap = namaSiswa.toLowerCase() + ". " + pesan;
                let utterance = new SpeechSynthesisUtterance(teksLengkap);
                utterance.lang = 'id-ID'; 
                utterance.rate = 1.0; 
                window.speechSynthesis.speak(utterance);
            }
        }

        const statusBox = document.getElementById('statusBox');
        const statusIcon = document.getElementById('statusIcon');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');

        function showStatus(type, title, desc) {
            statusBox.classList.remove('opacity-0', 'pointer-events-none');
            if (type === 'loading') { statusIcon.className = "fa-solid fa-circle-notch fa-spin text-5xl mb-4 text-indigo-400"; } 
            else if (type === 'success') { statusIcon.className = "fa-solid fa-circle-check text-6xl mb-4 text-emerald-400"; } 
            else if (type === 'error') { statusIcon.className = "fa-solid fa-triangle-exclamation text-6xl mb-4 text-rose-500"; }
            statusTitle.innerText = title;
            statusDesc.innerText = desc;
        }

        function hideStatus() { statusBox.classList.add('opacity-0', 'pointer-events-none'); }

        let isProcessing = false;

        function prosesAbsen(payload, namaTampilan, identifierNIS) {
            if (isProcessing) return;
            isProcessing = true;
            try { html5QrcodeScanner.pause(true); } catch(e){}

            const todayStr = new Date().toLocaleDateString('id-ID');
            const localKey = `absen_${identifierNIS.trim()}`;

            if (localStorage.getItem(localKey) === todayStr) {
                playBeep(true);
                showStatus('error', 'Akses Ditolak', 'Siswa sudah absen hari ini!');
                ucapkanSuara("Maaf " + namaTampilan, "Anda sudah absen");
                selesaiProses();
                return; 
            }

            playBeep(false);
            showStatus('loading', 'Menyimpan...', namaTampilan);

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ aksi: 'absen', ...payload }) })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    localStorage.setItem(localKey, todayStr);
                    showStatus('success', 'Berhasil!', `${namaTampilan}`);
                    ucapkanSuara(namaTampilan, "Presensi masuk berhasil");
                } else {
                    playBeep(true);
                    showStatus('error', 'Ditolak', res.message);
                    ucapkanSuara("Maaf " + namaTampilan, "Anda sudah absen");
                }
            })
            .catch(err => {
                playBeep(true);
                showStatus('error', 'Terputus', 'Cek koneksi internet Anda.');
            })
            .finally(() => { selesaiProses(); });
        }

        function selesaiProses() {
            setTimeout(() => {
                hideStatus();
                try { html5QrcodeScanner.resume(); } catch(e){}
                isProcessing = false;
                jagaFokusInput(); 
            }, 2500); 
        }

        function tangkapDataScan(decodedText) {
            if (isProcessing) return;
            let dataSiswa = { nama: "", nis: "", kelas: "" };
            let formatDikenali = false;

            try {
                const data = JSON.parse(decodedText);
                if (data.nama && data.nis) { dataSiswa = data; formatDikenali = true; }
            } catch (e) {
                const barisText = decodedText.split('\n');
                barisText.forEach(baris => {
                    if (baris.toUpperCase().includes('NIS:')) dataSiswa.nis = baris.split(':')[1].trim();
                    if (baris.toUpperCase().includes('NAMA:')) dataSiswa.nama = baris.split(':')[1].trim();
                    if (baris.toUpperCase().includes('KELAS:')) dataSiswa.kelas = baris.split(':')[1].trim();
                });
                if (dataSiswa.nis && dataSiswa.nama) formatDikenali = true;
            }

            if (formatDikenali) {
                prosesAbsen(dataSiswa, dataSiswa.nama, dataSiswa.nis);
            } else {
                playBeep(true);
                showStatus('error', 'QR Ditolak', 'Format tidak dikenali.');
                setTimeout(() => { hideStatus(); try{html5QrcodeScanner.resume();}catch(e){} }, 2000);
            }
        }

        const scanInput = document.getElementById('rfidFocusInput');
        function jagaFokusInput() { scanInput.focus(); }
        window.addEventListener('load', jagaFokusInput);
        document.addEventListener('click', jagaFokusInput);
        document.addEventListener('blur', jagaFokusInput, true);
        setInterval(jagaFokusInput, 1000);

        scanInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const hasilScan = scanInput.value.trim();
                scanInput.value = ''; 
                if (hasilScan.length > 0) tangkapDataScan(hasilScan); 
            }
        });

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 30, 
            qrbox: function(w, h) { return { width: Math.floor(Math.min(w, h) * 0.65), height: Math.floor(Math.min(w, h) * 0.65) }; },
            aspectRatio: 1.0, disableFlip: true, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
        }, false);
        
        html5QrcodeScanner.render((text) => tangkapDataScan(text));
    </script>
</body>
</html>
